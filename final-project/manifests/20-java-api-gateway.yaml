apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-api-gateway
  namespace: hybrid-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-api-gateway
  template:
    metadata:
      labels:
        app: java-api-gateway
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: gateway
          image: eclipse-temurin:21-jre
          command:
            - /bin/sh
            - -c
            - sleep 3600
          ports:
            - containerPort: 8080
