apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-nginx
  labels:
    app: linux-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linux-nginx
  template:
    metadata:
      labels:
        app: linux-nginx
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
