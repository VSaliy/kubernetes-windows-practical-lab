apiVersion: apps/v1
kind: Deployment
metadata:
  name: windows-iis
  labels:
    app: windows-iis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: windows-iis
  template:
    metadata:
      labels:
        app: windows-iis
    spec:
      nodeSelector:
        kubernetes.io/os: windows
      containers:
        - name: iis
          image: mcr.microsoft.com/windows/servercore/iis:windowsservercore-ltsc2022
          ports:
            - containerPort: 80
